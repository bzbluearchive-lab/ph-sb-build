name: build-arm64e
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash curl sudo git make ca-certificates xz-utils file

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          ls -la $THEOS | head -20
          ls $THEOS/toolchain 2>/dev/null | head -5
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build tweak (arm64e)
        run: |
          set -x
          make clean || true
          make FINALPACKAGE=1 ARCHS=arm64e 2>&1 | tail -40
          find .theos -name '*.dylib' | head -5
          DYLIB=$(find .theos -name 'PhantomSB.dylib' | head -1)
          echo "DYLIB=$DYLIB"
          file "$DYLIB"
          cp "$DYLIB" PhantomSB.dylib
          shasum -a 256 PhantomSB.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: PhantomSB
          path: PhantomSB.dylib

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .theos
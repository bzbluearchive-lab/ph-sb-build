name: build-arm64e
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git autoconf automake libtool pkg-config libssl-dev libxml2-dev \
            zlib1g-dev libedit-dev libncurses5-dev libblocksruntime-dev clang llvm-dev xz-utils file

      - name: Cache ld64
        id: ld64cache
        uses: actions/cache@v4
        with:
          path: ~/cctools
          key: ld64-home-v2-${{ runner.os }}

      - name: Build ld64 (cctools-port)
        if: steps.ld64cache.outputs.cache-hit != 'true'
        run: |
          set -x
          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git /tmp/cp
          cd /tmp/cp/cctools
          ./autogen.sh > /tmp/autogen.log 2>&1 || { tail -40 /tmp/autogen.log; exit 1; }
          LLVMCONF=$(ls /usr/lib/llvm-*/bin/llvm-config | head -1)
          ./configure --prefix="$HOME/cctools" --target=x86_64-apple-darwin11 --with-llvm-config="$LLVMCONF" > /tmp/conf.log 2>&1 || { tail -50 /tmp/conf.log; exit 1; }
          make -j"$(nproc)" ld64 > /tmp/make.log 2>&1 || { tail -60 /tmp/make.log; exit 1; }
          BIN=$(find /tmp/cp/cctools -type f -name 'ld' -perm -u+x | head -1)
          echo "BIN=$BIN"
          mkdir -p "$HOME/cctools/bin"
          cp "$BIN" "$HOME/cctools/bin/ld64"
          chmod +x "$HOME/cctools/bin/ld64"
          "$HOME/cctools/bin/ld64" -v | head -3

      - name: Fetch iOS SDK
        run: |
          set -x
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          ls /tmp/sdks | head -10
          SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Compile + link arm64e dylib
        run: |
          set -x
          clang++ -target arm64e-apple-ios15.0 -isysroot "$SDK" -O2 -fPIC -fobjc-arc -std=c++17 \
            -Wno-everything -c -o /tmp/probe.o payload/phantomsb_probe.mm
          file /tmp/probe.o
          "$HOME/cctools/bin/ld64" -arch arm64e -dylib -o PhantomSB.dylib /tmp/probe.o \
            -syslibroot "$SDK" -platform_version ios 15.0 16.5 \
            -L"$SDK/usr/lib" -lSystem -lobjc -lc++ -lc++abi \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics
          file PhantomSB.dylib
          otool -hv PhantomSB.dylib | head -4 || true
          shasum -a 256 PhantomSB.dylib

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/autogen.log
            /tmp/conf.log
            /tmp/make.log

      - uses: actions/upload-artifact@v4
        with:
          name: PhantomSB
          path: PhantomSB.dylib
